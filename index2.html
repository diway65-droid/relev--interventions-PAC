<!DOCTYPE html>
<html lang="fr" data-mode="CHAUD">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relevés PAC</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b8372b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Relevés PAC">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fbeceb;--card:#fff;--ink:#16202a;--mute:#5b6875;--line:#d9d2d2;--field:#f7f8fa;--acc:#b8372b;--accink:#fff;--cold:#1f6fb2;--cold-bg:#edf5fc;--hot:#c93b2b;--hot-bg:#fdf0ed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="FROID"]{--bg:#eaf3fc;--line:#d2dce6;--acc:#1f6fb2}
@media (prefers-color-scheme:dark){
 :root:not([data-theme="light"]){--bg:#2a1517;--card:#1f1a1b;--ink:#ecf0f3;--mute:#a2adb8;--line:#3d2f31;--field:#171213;--acc:#ef7b6e;--accink:#2b0a07;--cold:#6bb8ee;--cold-bg:#102235;--hot:#f57c6c;--hot-bg:#351515}
 :root:not([data-theme="light"])[data-mode="FROID"]{--bg:#0f1c29;--card:#16222e;--line:#2b3b4a;--field:#101a24;--acc:#6bb8ee;--accink:#06222d}
}
:root[data-theme="dark"]{--bg:#2a1517;--card:#1f1a1b;--ink:#ecf0f3;--mute:#a2adb8;--line:#3d2f31;--field:#171213;--acc:#ef7b6e;--accink:#2b0a07;--cold:#6bb8ee;--cold-bg:#102235;--hot:#f57c6c;--hot-bg:#351515}
:root[data-theme="dark"][data-mode="FROID"]{--bg:#0f1c29;--card:#16222e;--line:#2b3b4a;--field:#101a24;--acc:#6bb8ee;--accink:#06222d}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Barlow","Segoe UI",Roboto,system-ui,sans-serif;transition:background .25s}
main{max-width:620px;margin:0 auto;padding:14px 12px 40px}
h1{font:700 26px/1.1 "Barlow Condensed","Arial Narrow",Roboto,sans-serif;margin:6px 0 12px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;color:var(--mute);font:600 16px inherit;font-family:inherit;padding:10px;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
section{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:10px;padding:10px 12px 4px;margin-bottom:12px}
h2{font:700 19px "Barlow Condensed","Arial Narrow",Roboto,sans-serif;margin:0 0 6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row label{flex:1;font-size:15px;min-width:0}
.row .u{width:32px;color:var(--mute);font-size:14px}
input[type=text]{width:118px;font:600 17px inherit;font-family:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:9px 10px;text-align:right}

/* Couleurs spécifiques froid / chaud */
.row.row-cold label{color:var(--cold);font-weight:600}
.row.row-cold input[type=text]{border-color:var(--cold);background:var(--cold-bg)}
.row.row-hot label{color:var(--hot);font-weight:600}
.row.row-hot input[type=text]{border-color:var(--hot);background:var(--hot-bg)}

.chips{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chips button{border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:16px;padding:5px 11px;font:500 14px inherit;font-family:inherit}
input:focus,button:focus-visible,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
.out{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
textarea{width:100%;height:300px;resize:vertical;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--mute);font-size:14px}
.btns{display:flex;gap:8px}
.btns button{flex:1;font:700 17px inherit;font-family:inherit;border-radius:10px;padding:13px;border:1px solid var(--line);background:var(--field);color:var(--ink)}
.btns .main{flex:2;background:var(--acc);color:var(--accink);border-color:var(--acc)}
.perso{margin-top:12px;font-size:14px;color:var(--mute);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.perso b{color:var(--ink)}
.perso input{width:75px;padding:4px 6px;font-size:15px;text-align:right}
.pw{margin:6px 0;font-size:16px;color:var(--ink)}
.conv-box{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:8px}

:root{--ok:#2e8b57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#5fcf93}}
:root[data-theme="dark"]{--ok:#5fcf93}
main{padding-bottom:96px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:10px;padding:12px;font:700 17px inherit;font-family:inherit;background:var(--field);color:var(--mute)}
.tabs button[aria-pressed="true"]{background:var(--acc);color:var(--accink)}
.pill{display:inline-block;background:var(--acc);color:var(--accink);font-weight:700;font-size:14px;padding:5px 12px;border-radius:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.card small{display:block;color:var(--mute);font-size:12px}
.card b{font:700 18px "Barlow Condensed","Arial Narrow",Roboto,sans-serif;word-break:break-word}
.card b.e{color:var(--mute);opacity:.5}
.card.k{border-left:5px solid var(--acc)}.card.k b{font-size:22px}
.card.ok b{color:var(--ok)}.card.bad b{color:var(--hot)}
.ttl{font:700 13px "Barlow Condensed",Arial,sans-serif;letter-spacing:.08em;color:var(--mute);margin:12px 2px 6px;text-transform:uppercase}
.schema{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin:10px 0}
.schema svg{display:block;width:100%;height:auto}
.schema text{text-anchor:middle;font-family:"Barlow","Segoe UI",Roboto,system-ui,sans-serif}
.pipe{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.hot{stroke:var(--hot)}.cold{stroke:var(--cold)}
.coil{fill:none;stroke-width:5;stroke-linejoin:round}
.flow{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:2;stroke-dasharray:6 14;stroke-linecap:round;animation:fl 1.2s linear infinite}
@keyframes fl{to{stroke-dashoffset:-20}}
@media (prefers-reduced-motion:reduce){.flow{animation:none}}
.b rect{fill:var(--card);stroke-width:2}
.b.h rect{stroke:var(--hot)}.b.c rect{stroke:var(--cold)}
.b.h.big rect{fill:var(--hot-bg)}.b.c.big rect{fill:var(--cold-bg)}
.bl{font-size:11px;fill:var(--mute);font-weight:600}
.bv{font-size:20px;font-weight:700;fill:var(--ink)}
.bv.e{fill:var(--mute);opacity:.45}
.bu{font-size:12px;font-weight:500;fill:var(--mute)}
.lab{font:700 13px "Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.06em}
.brand{display:flex;align-items:center;gap:10px;margin:2px 0 4px}
.brand img{width:52px;height:52px;border-radius:10px;border:1px solid var(--line)}
.brand h1{margin:0}
.send{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.send h2{margin-bottom:8px}
.send .f{display:flex;align-items:center;gap:8px;margin:6px 0}
.send .f label{width:56px;font-size:15px;color:var(--mute)}
.send .f input{flex:1;width:auto;text-align:left;font-weight:500;font-size:16px;min-width:0}
.send .f input[type=date]{font-family:inherit}
.send .f .chips{flex:none}
.send small{display:block;color:var(--mute);font-size:12.5px;margin:4px 0 10px}
.btns.two{margin-top:6px}
</style>
</head>
<body>
<main>
<div id="p1">
<div class="brand"><img src="android-chrome-192x192.png" alt="Adour Eco Énergies"><h1>Relevés pompe à chaleur</h1></div>
<div class="seg" id="mode"></div>
<div class="seg" id="ph"></div>
<label class="chk"><input type="checkbox" id="kb"> Clavier complet (lettres) pour tous les champs</label>
<div id="form"></div>
<div class="out">
<textarea id="txt" readonly aria-label="Texte du rapport"></textarea>
<label class="chk"><input type="checkbox" id="norm"> Sans accents</label>
<div class="btns"><button class="main" id="copy">Copier le texte</button><button id="reset">Effacer</button></div>
</div>
<div class="perso" id="perso"></div>
<div class="send">
<h2>Enregistrer / envoyer le rapport</h2>
<small>Client, lieu et date sont facultatifs : laissez vide si vous n'envoyez pas le rapport.</small>
<div class="f"><label for="cli">Client</label><input type="text" id="cli" autocomplete="off" inputmode="text"></div>
<div class="f"><label for="lieu">Lieu</label><input type="text" id="lieu" autocomplete="off" inputmode="text"></div>
<div class="f"><label for="dat">Date</label><input type="date" id="dat"><span class="chips"><button id="today" type="button">Aujourd'hui</button></span></div>
<div class="btns two"><button id="save_img" type="button">💾 Enregistrer</button><button class="main" id="share" type="button">📤 Envoyer</button></div>
<small id="smsg" style="margin:8px 0 0"></small>
</div>
</div>
<div id="p2" hidden>
<h1>Schéma frigorifique</h1>
<div class="pill" id="pmode"></div>
<div class="ttl">Performance</div><div class="grid" id="kpi"></div>
<div class="ttl">Électrique</div><div class="grid" id="elec"></div>
<div class="schema"><svg id="svg" viewBox="0 0 600 620" role="img" aria-label="Circuit frigorifique"></svg></div>
<div class="ttl">Hydraulique &amp; ambiance</div><div class="grid" id="hyd"></div>
</div>
</main>
<nav class="tabs" id="tabs"><button data-p="1">📋 Relevés</button><button data-p="2">🔧 Schéma</button></nav>
<script>
const OKS=["OK","Non conforme"];
function groups(tri){
 const el=[["vide","Tension à vide","V"],["nt","Tension N/T","V"]];
 if(tri){el.push(["ch1","Tension en charge L1-L2","V"],["ch2","Tension en charge L2-L3","V"],["ch3","Tension en charge L3-L1","V"],
  ["cp1","Intensité compresseur L1","A"],["cp2","Intensité compresseur L2","A"],["cp3","Intensité compresseur L3","A"])}
 else el.push(["ch","Tension en charge","V"],["cp","Intensité compresseur (CP)","A"]);
 el.push(["app","Intensité appoint","A"],["iso","Contrôle isolement","",OKS],["ser","Contrôle serrage électrique","",["OK","Resserré"]]);
 return [
 {t:"Paramètres électriques",h:"PARAMÈTRES ÉLECTRIQUES",c:"#e0a800",f:el},
 {t:"Paramètres hydrauliques",h:"PARAMÈTRES HYDRAULIQUES",c:"#2f7fc1",f:[
  ["vase","Contrôle vase expansion","",null,null,true],
  ["filtre","Contrôle filtre","",["Très encrassé / nettoyé OK","Nettoyé / OK","Pas de filtre","Filtre HS"]],
  ["eau","Qualité de l'eau","",["Claire","Trouble","Boueuse"]],
  ["debit","Débit","l/min"]]},
 {t:"Températures et pressions",h:"TEMPÉRATURES ET PRESSIONS",c:"#d4572f",f:[
  ["tee","T° entrée évaporateur","°C",null,"cold"],
  ["tse","T° sortie évaporateur","°C",null,"cold"],
  ["tec","T° entrée condenseur","°C",null,"hot"],
  ["tsc","T° sortie condenseur","°C",null,"hot"],
  ["tgc","T° gaz chaud","°C",null,"hot"],
  ["tasp","T° aspiration","°C",null,"cold"],
  ["hp","Pression haute pression (HP)","bar",null,"hot"],
  ["bp","Pression basse pression (BP)","bar",null,"cold"],
  ["text","T° extérieure","°C",null,null],
  ["tint","T° intérieure","°C",null,null]]}
 ];
}
const KEY="pac-releves-v2";
let S={page:"1",mode:"CHAUD",tri:false,v:{},kb:false,cos:"1",norm:false,c_m3:"",c_lpm:"",cli:"",lieu:"",dat:""};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const num=k=>{const x=parseFloat(String(S.v[k]||"").replace(",","."));return isNaN(x)?null:x};
const avg=ks=>{const a=ks.map(num).filter(x=>x!==null);return a.length?a.reduce((s,x)=>s+x,0)/a.length:null};
const strip=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[’]/g,"'");
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
function build(){
 document.documentElement.dataset.mode=S.mode;
 $("mode").innerHTML=["CHAUD","FROID"].map(m=>`<button data-m="${m}" aria-pressed="${S.mode===m}">Mode ${m.toLowerCase()}</button>`).join("");
 $("ph").innerHTML=[[false,"Monophasé"],[true,"Triphasé"]].map(p=>`<button data-t="${p[0]}" aria-pressed="${S.tri===p[0]}">${p[1]}</button>`).join("");
 $("form").innerHTML=groups(S.tri).map(g=>`<section style="--c:${g.c}"><h2>${g.t}</h2>`+g.f.map(f=>{
  const k=f[0],v=S.v[k]||"",opts=f[3],colorType=f[4],forceText=f[5];
  const mode=(opts||S.kb||forceText)?"text":"decimal";
  const rowClass="row"+(colorType?(" row-"+colorType):"");
  return `<div class="${rowClass}"><label for="i_${k}">${f[1]}</label><input type="text" id="i_${k}" data-k="${k}" inputmode="${mode}" enterkeyhint="next" autocomplete="off" value="${esc(v)}">`+
  `<span class="u">${f[2]}</span>`+(opts?`<span style="width:30px"></span><div class="chips">${opts.map(o=>`<button data-c="${k}" data-val="${esc(o)}">${o}</button>`).join("")}</div>`
   :"")+`</div>`}).join("")+`</section>`).join("");
 $("norm").checked=S.norm;$("kb").checked=S.kb;
}
function fmtDate(d){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||"");return m?m[3]+"/"+m[2]+"/"+m[1]:""}
function infoLines(){const l=[];if((S.cli||"").trim())l.push("Client : "+S.cli.trim());if((S.lieu||"").trim())l.push("Lieu : "+S.lieu.trim());if(S.dat)l.push("Date : "+fmtDate(S.dat));return l}
function report(){
 let o=["VALEURS RELEVÉES PAC"];
 const inf=infoLines();if(inf.length)o.push(...inf);
 o.push("Relevés : Mode "+S.mode,"Alimentation : "+(S.tri?"triphasée":"monophasée"));
 groups(S.tri).forEach(g=>{
  const l=g.f.map(f=>{const v=(S.v[f[0]]||"").trim();return v?`${f[1]} : ${v}${f[2]?" "+f[2]:""}`:null}).filter(Boolean);
  if(l.length)o.push("",g.h,...l);
 });
 const t=o.join("\n");return S.norm?strip(t):t;
}
function perso(){
 const q=num("debit"),te=num("tec"),ts=num("tsc");
 const U=S.tri?avg(["ch1","ch2","ch3"]):num("ch"),I=S.tri?avg(["cp1","cp2","cp3"]):num("cp");
 const cos=parseFloat(String(S.cos).replace(",","."))||1;
 let h=`<div><b>Outils & indicateurs (absents du rapport) :</b><br>cos φ <input type="text" inputmode="decimal" id="cos" value="${esc(S.cos)}"> `;
 if(q!==null)h+=`Débit : ${(q*0.06).toFixed(2)} m³/h. `;
const P=(U!==null&&I!==null)?(S.tri?Math.sqrt(3):1)*U*I*cos/1000:null;
 h+=`<div class="pw">Puissance consommée (${S.tri?"√3×U×I×cos φ":"U×I×cos φ"}) : <b>${P!==null?P.toFixed(2)+" kW":"—"}</b></div>`;
 if(P!==null&&q!==null&&te!==null&&ts!==null&&P>0){
  const Q=q*(ts-te)*0.0698;
  h+=`Chaleur produite : <b>${Q.toFixed(2)} kW</b>. COP estimé : <b>${(Q/P).toFixed(2)}</b>.`;
 }else{
  h+=P===null?"Saisissez tension et intensité pour la puissance et le COP.":"Saisissez débit et températures condenseur pour le COP.";
 }
 h+=`</div>
 <div class="conv-box">
  <b>Convertisseur débit :</b>
  <input type="text" id="conv_m3" inputmode="decimal" placeholder="m³/h" value="${esc(S.c_m3||"")}"> m³/h
  <span>⇄</span>
  <input type="text" id="conv_lpm" inputmode="decimal" placeholder="l/min" value="${esc(S.c_lpm||"")}"> l/min
 </div>`;
 const activeId=document.activeElement?document.activeElement.id:null;
 $("perso").innerHTML=h;
 if(activeId && $(activeId)){
  const elem=$(activeId);elem.focus();elem.setSelectionRange(elem.value.length,elem.value.length);
 }
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function refresh(){$("txt").value=report();perso();draw();save()}
$("mode").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.mode=b.dataset.m;build();refresh()};
$("ph").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.tri=b.dataset.t==="true";build();refresh()};
$("form").oninput=e=>{const k=e.target.dataset.k;if(k){S.v[k]=e.target.value;refresh()}};
$("form").onclick=e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.c){S.v[b.dataset.c]=b.dataset.val;build();refresh();focusNext(b.dataset.c)}
};
function focusNext(k){
 const ins=[...document.querySelectorAll("#form input[data-k]")];
 const i=ins.findIndex(x=>x.dataset.k===k);
 if(ins[i+1]){ins[i+1].focus();ins[i+1].scrollIntoView({block:"center",behavior:"smooth"})}else if(ins[i])ins[i].blur();
}
$("form").onkeydown=e=>{if(e.key==="Enter"&&e.target.dataset.k){e.preventDefault();focusNext(e.target.dataset.k)}};
$("kb").onchange=e=>{S.kb=e.target.checked;build();save()};
$("perso").oninput=e=>{
 if(e.target.id==="cos"){S.cos=e.target.value;perso();save()}
 else if(e.target.id==="conv_m3"){
  S.c_m3=e.target.value;
  const v=parseFloat(e.target.value.replace(",","."));
  S.c_lpm=isNaN(v)?"":(v*1000/60).toFixed(1);
  perso();save();
 }else if(e.target.id==="conv_lpm"){
  S.c_lpm=e.target.value;
  const v=parseFloat(e.target.value.replace(",","."));
  S.c_m3=isNaN(v)?"":(v*0.06).toFixed(2);
  perso();save();
 }
};
$("norm").onchange=e=>{S.norm=e.target.checked;refresh()};
let armed=0;
$("reset").onclick=()=>{
 const b=$("reset");
 if(!armed){armed=1;b.textContent="Confirmer ?";setTimeout(()=>{armed=0;b.textContent="Effacer"},2500);return}
 armed=0;b.textContent="Effacer";S.v={};build();refresh();
};
$("copy").onclick=async()=>{
 const t=$("txt").value,b=$("copy");let ok=false;
 try{await navigator.clipboard.writeText(t);ok=true}catch(e){$("txt").select();try{ok=document.execCommand("copy")}catch(e2){}}
 b.textContent=ok?"Copié ✓":"Sélectionnez puis copiez";setTimeout(()=>b.textContent="Copier le texte",1800);
};

const val=k=>String(S.v[k]||"").trim();
const fmt=(x,n)=>x===null?null:x.toFixed(n);
function B(x,y,label,k,unit,cls,big){
 const v=val(k),h=big?58:46;
 return `<g class="b ${cls}${big?" big":""}" transform="translate(${x} ${y})"><rect width="105" height="${h}" rx="10"/><text class="bl" x="52.5" y="15">${label}</text><text class="bv${v?"":" e"}" x="52.5" y="${big?42:37}"${big?' style="font-size:24px"':""}>${v?esc(v)+`<tspan class="bu"> ${unit}</tspan>`:"—"}</text></g>`;
}
function dT(a,b){const x=num(a),y=num(b);return x!==null&&y!==null?" · ΔT "+Math.abs(x-y).toFixed(1)+" K":""}
function schemaSvg(){
 const red="M342 120 H500 V180 M500 440 V560 H322",blue="M278 560 H100 V440 M100 180 V120 H258";
 const coil=(x,c)=>`<path class="coil ${c}" d="M${x} 180 V200 L${x-35} 215 L${x+35} 245 L${x-35} 275 L${x+35} 305 L${x-35} 335 L${x+35} 365 L${x-35} 395 L${x} 410 V440"/>`;
 return `<rect x="430" y="180" width="140" height="260" rx="14" fill="var(--hot)" fill-opacity=".1" stroke="var(--hot)" stroke-width="2"/>
 <rect x="30" y="180" width="140" height="260" rx="14" fill="var(--cold)" fill-opacity=".1" stroke="var(--cold)" stroke-width="2"/>
 ${coil(500,"hot")}${coil(100,"cold")}
 <path class="pipe hot" d="${red}"/><path class="pipe cold" d="${blue}"/>
 <path class="flow" d="${red}"/><path class="flow" d="${blue}"/>

const C=(l,v,u,cls)=>`<div class="card ${cls||""}"><small>${l}</small><b${v?"":' class="e"'}>${v?esc(v)+(u?" "+u:""):"—"}</b></div>`;
const three=(a,b,c)=>{const t=[a,b,c].map(val);return t.some(Boolean)?t.map(x=>x||"–").join(" / "):""};
function draw(){
 $("pmode").textContent="Mode "+S.mode.toLowerCase()+" · "+(S.tri?"triphasé":"monophasé");
 $("svg").innerHTML=schemaSvg();
 const q=num("debit"),te=num("tec"),ts=num("tsc");
 const U=S.tri?avg(["ch1","ch2","ch3"]):num("ch"),I=S.tri?avg(["cp1","cp2","cp3"]):num("cp");
 const cos=parseFloat(String(S.cos).replace(",","."))||1;
 let P=null,Q=null,cop=null;
 if(U!==null&&I!==null)P=(S.tri?Math.sqrt(3):1)*U*I*cos/1000;
 if(P&&q!==null&&te!==null&&ts!==null){Q=q*(ts-te)*0.0698;cop=Q/P}
 $("kpi").innerHTML=C("Puissance absorbée",fmt(P,2),"kW","k")+C("Chaleur produite",fmt(Q,2),"kW","k")+C("COP estimé",fmt(cop,2),"","k");
 const st=(k,l,good)=>C(l,val(k),"",!val(k)?"":(good.includes(val(k))?"ok":"bad"));
 $("elec").innerHTML=[C("Tension à vide",val("vide"),"V"),C("Tension N/T",val("nt"),"V"),
  S.tri?C("Tension en charge",three("ch1","ch2","ch3"),"V"):C("Tension en charge",val("ch"),"V"),
  S.tri?C("Intensité compr.",three("cp1","cp2","cp3"),"A"):C("Intensité compr.",val("cp"),"A"),
  C("Intensité appoint",val("app"),"A"),st("iso","Isolement",["OK"]),st("ser","Serrage élec.",["OK","Resserré"])].join("");
 $("hyd").innerHTML=[C("Débit",val("debit"),"l/min"),C("Qualité eau",val("eau"),""),C("Filtre",val("filtre"),""),C("Vase expansion",val("vase"),""),C("T° extérieure",val("text"),"°C"),C("T° intérieure",val("tint"),"°C")].join("");
}
function show(p){
 S.page=p==="2"?"2":"1";
 $("p1").hidden=S.page!=="1";$("p2").hidden=S.page!=="2";
 document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p===S.page));
 window.scrollTo(0,0);save();
}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(b)show(b.dataset.p)};
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{
 if(e.target.closest("input,textarea"))return;
 const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>90&&Math.abs(dy)<50)show(dx<0?"2":"1");
},{passive:true});
build();refresh();show(S.page);

const xe=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function exportSvg(){
 const W=800,M=30,lines=infoLines();
 let y=30,out="";
 out+=`<image href="${LOGO}" x="${M}" y="${y}" width="84" height="84"/>`;
 out+=`<text x="${M+100}" y="${y+36}" font-size="30" font-weight="700" fill="#16202a">VALEURS RELEVÉES</text>`;
 out+=`<text x="${M+100}" y="${y+66}" font-size="17" fill="#5b6875">Pompe à chaleur · Mode ${S.mode.toLowerCase()} · ${S.tri?"triphasé":"monophasé"}</text>`;
 y+=84+18;
 if(lines.length){
  out+=`<rect x="${M}" y="${y}" width="${W-2*M}" height="${16+lines.length*26}" rx="10" fill="#f7f8fa" stroke="#d9d2d2"/>`;
  lines.forEach((t,i)=>{const [a,...b]=t.split(" : ");out+=`<text x="${M+16}" y="${y+28+i*26}" font-size="18"><tspan fill="#5b6875">${xe(a)} : </tspan><tspan font-weight="700" fill="#16202a">${xe(b.join(" : "))}</tspan></text>`});
  y+=16+lines.length*26+16;
 }
 groups(S.tri).forEach(g=>{
  const rows=g.f.map(f=>{const v=(S.v[f[0]]||"").trim();return v?[f[1],v+(f[2]?" "+f[2]:"")]:null}).filter(Boolean);
  if(!rows.length)return;
  out+=`<rect x="${M}" y="${y}" width="6" height="${34+rows.length*28}" fill="${g.c}"/>`;
  out+=`<text x="${M+18}" y="${y+22}" font-size="17" font-weight="700" fill="#16202a" letter-spacing="1">${xe(g.h)}</text>`;
  rows.forEach((r,i)=>{const ry=y+52+i*28;
   out+=`<line x1="${M+18}" x2="${W-M}" y1="${ry-20}" y2="${ry-20}" stroke="#ece7e7"/>`;
   out+=`<text x="${M+18}" y="${ry}" font-size="17" fill="#16202a">${xe(r[0])}</text><text x="${W-M}" y="${ry}" font-size="17" font-weight="700" text-anchor="end" fill="#16202a">${xe(r[1])}</text>`});
  y+=34+rows.length*28+18;
 });
 // schéma (couleurs fixes, thème clair)
 const sv=schemaSvg().replace(/var\(--hot-bg\)/g,"#fdf0ed").replace(/var\(--cold-bg\)/g,"#edf5fc").replace(/var\(--hot\)/g,"#c93b2b").replace(/var\(--cold\)/g,"#1f6fb2").replace(/var\(--card\)/g,"#ffffff").replace(/var\(--ink\)/g,"#16202a").replace(/var\(--mute\)/g,"#5b6875");
 const sw=560,sh=sw*620/600;
 out+=`<text x="${M}" y="${y+16}" font-size="15" font-weight="700" fill="#5b6875" letter-spacing="1.5">SCHÉMA FRIGORIFIQUE</text>`;
 y+=26;
 out+=`<svg x="${(W-sw)/2}" y="${y}" width="${sw}" height="${sh}" viewBox="0 0 600 620">${sv}</svg>`;
 y+=sh+14;
 out+=`<text x="${W/2}" y="${y+10}" font-size="13" text-anchor="middle" fill="#8a949e">Adour Eco Énergies</text>`;
 const H=y+30;
 const css=`<style>text{font-family:Arial,Helvetica,sans-serif}.pipe{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}.hot{stroke:#c93b2b}.cold{stroke:#1f6fb2}.coil{fill:none;stroke-width:5;stroke-linejoin:round}.flow{fill:none;stroke:#fff;stroke-opacity:.6;stroke-width:2;stroke-dasharray:6 14;stroke-linecap:round}.b rect{fill:#fff;stroke-width:2}.b.h rect{stroke:#c93b2b}.b.c rect{stroke:#1f6fb2}.b.h.big rect{fill:#fdf0ed}.b.c.big rect{fill:#edf5fc}.bl{font-size:11px;fill:#5b6875;font-weight:600;text-anchor:middle}.bv{font-size:20px;font-weight:700;fill:#16202a;text-anchor:middle}.bv.e{fill:#5b6875;opacity:.45}.bu{font-size:12px;font-weight:500;fill:#5b6875}.lab{font-size:13px;font-weight:700;letter-spacing:.06em;text-anchor:middle}svg svg text{text-anchor:middle}</style>`;
 return {svg:`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${css}<rect width="${W}" height="${H}" fill="#fff"/>${out}</svg>`,W,H};
}
function makePng(){
 return new Promise((res,rej)=>{
  const {svg,W,H}=exportSvg(),sc=2,img=new Image();
  img.onload=()=>{const c=document.createElement("canvas");c.width=W*sc;c.height=H*sc;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
   c.toBlob(b=>b?res(b):rej(new Error("png")),"image/png")};
  img.onerror=()=>rej(new Error("svg"));
  img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);
 });
}
function fname(){
 const sl=s=>(s||"").trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"");
 return ["Valeurs-relevees",sl(S.cli),sl(S.lieu),S.dat].filter(Boolean).join("_")+".png";
}
function msg(t){const m=$("smsg");m.textContent=t;setTimeout(()=>{if(m.textContent===t)m.textContent=""},4000)}
function download(b,n){const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$("cli").value=S.cli||"";$("lieu").value=S.lieu||"";$("dat").value=S.dat||"";
$("cli").oninput=e=>{S.cli=e.target.value;$("txt").value=report();save()};
$("lieu").oninput=e=>{S.lieu=e.target.value;$("txt").value=report();save()};
$("dat").onchange=e=>{S.dat=e.target.value;$("txt").value=report();save()};
$("today").onclick=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");S.dat=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate());$("dat").value=S.dat;$("txt").value=report();save()};
$("save_img").onclick=async()=>{try{download(await makePng(),fname());msg("Image enregistrée ✓")}catch(e){msg("Échec de la création de l'image")}};
$("share").onclick=async()=>{
 try{
  const b=await makePng(),f=new File([b],fname(),{type:"image/png"});
  const title="Valeurs relevées PAC"+(S.cli?" – "+S.cli.trim():"");
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title,text:report()});}
  else{download(b,fname());msg("Partage non disponible ici : image enregistrée, à joindre à votre message.")}
 }catch(e){if(e&&e.name!=="AbortError")msg("Échec de l'envoi")}
};
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
